name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: ""

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (Release Mode)
        run: cargo build --locked --release --verbose

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_BIN="tapes-x86_64-unknown-linux-gnu"
          ARCHIVE_NAME="${RAW_BIN}-${GITHUB_REF_NAME}"

          mkdir -p "$ARCHIVE_NAME"
          cp target/release/tapes "$RAW_BIN"
          cp target/release/tapes "$ARCHIVE_NAME/"
          tar -czf "${ARCHIVE_NAME}.tgz" "$ARCHIVE_NAME"

          gh release create "$GITHUB_REF_NAME" "$RAW_BIN" "${ARCHIVE_NAME}.tgz" \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
