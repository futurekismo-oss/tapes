name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: ""

jobs:
  validate:
    permissions:
      contents: read
    uses: $/.github/workflows/lint.yml

  build:
    name: Build artifacts and publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (Release Mode)
        run: cargo build --locked --release --verbose

      - name: Package and publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_BIN="tapes-x86_64-unknown-linux-gnu"
          ARCHIVE_NAME="${RAW_BIN}-${GITHUB_REF_NAME}"

          mkdir -p "$ARCHIVE_NAME"
          cp target/release/tapes "$RAW_BIN"
          cp target/release/tapes "$ARCHIVE_NAME/"
          tar -czf "${ARCHIVE_NAME}.tgz" "$ARCHIVE_NAME"

          gh release create "$GITHUB_REF_NAME" "$RAW_BIN" "${ARCHIVE_NAME}.tgz" \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes

  publish:
    name: Publish to crates.io
    needs: build
    if: github.repository == 'futurekismo-oss/tapes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        if: github.event_name == 'push'
        shell: python
        run: |
          import os
          import tomllib

          with open("Cargo.toml", "rb") as file:
              version = tomllib.load(file)["package"]["version"]

          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match {expected!r}")

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify crate publication
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --locked --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Publish crate
        if: github.event_name == 'push'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
